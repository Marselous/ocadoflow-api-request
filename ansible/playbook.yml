---
# ============================================================
#  OcadoFlow — Ansible Configuration Management
#  Author : Stanislav Vainer
#  Purpose: ECS host hardening, IAM policy enforcement,
#           secrets rotation, and service health validation
# ============================================================

- name: "OcadoFlow :: Bootstrap & Harden ECS Hosts"
  hosts: ecs_hosts
  become: true
  gather_facts: true
  vars:
    app_name: ocadoflow
    aws_region: eu-west-1
    max_log_retention_days: 90
    allowed_ssh_users:
      - stanislav.vainer
      - ops-user
    services:
      - name: products
        port: 8081
        health_path: /health
      - name: orders
        port: 8082
        health_path: /health
      - name: iam
        port: 8083
        health_path: /health

  handlers:
    - name: restart sshd
      service: name=sshd state=restarted

    - name: restart auditd
      service: name=auditd state=restarted

  tasks:
    # ── System Hardening ──────────────────────────────────
    - name: "SEC | Disable root SSH login"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PermitRootLogin'
        line: 'PermitRootLogin no'
      notify: restart sshd

    - name: "SEC | Enforce SSH key-only auth"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^PasswordAuthentication'
        line: 'PasswordAuthentication no'
      notify: restart sshd

    - name: "SEC | Set SSH allowed users"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^AllowUsers'
        line: "AllowUsers {{ allowed_ssh_users | join(' ') }}"
      notify: restart sshd

    - name: "SEC | Configure auditd rules"
      copy:
        dest: /etc/audit/rules.d/ocadoflow.rules
        content: |
          # Monitor IAM-related file changes
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/sudoers -p wa -k privilege_escalation
          # Monitor Docker socket
          -w /var/run/docker.sock -p rwxa -k docker
          # Monitor ECS agent config
          -w /etc/ecs/ -p wa -k ecs_config
      notify: restart auditd

    - name: "SEC | Set kernel hardening parameters"
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        sysctl_set: true
      loop:
        - { key: 'net.ipv4.conf.all.rp_filter',       value: '1' }
        - { key: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { key: 'net.ipv4.tcp_syncookies',            value: '1' }
        - { key: 'kernel.dmesg_restrict',              value: '1' }

    # ── Docker & ECS ──────────────────────────────────────
    - name: "ECS | Ensure Docker daemon security config"
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "log-driver": "awslogs",
            "log-opts": {
              "awslogs-region": "{{ aws_region }}",
              "awslogs-group": "/ecs/{{ app_name }}"
            },
            "no-new-privileges": true,
            "userns-remap": "default",
            "live-restore": true
          }

    - name: "ECS | Configure ECS agent"
      copy:
        dest: /etc/ecs/ecs.config
        content: |
          ECS_CLUSTER={{ app_name }}-cluster
          ECS_LOGLEVEL=info
          ECS_ENABLE_TASK_IAM_ROLE=true
          ECS_ENABLE_TASK_IAM_ROLE_NETWORK_HOST=true
          ECS_CONTAINER_STOP_TIMEOUT=30s
          ECS_ENABLE_CONTAINER_METADATA=true
          ECS_AVAILABLE_LOGGING_DRIVERS=["awslogs","json-file"]

    # ── CloudWatch Agent ──────────────────────────────────
    - name: "OBS | Install CloudWatch agent"
      package:
        name: amazon-cloudwatch-agent
        state: present

    - name: "OBS | Configure CloudWatch agent"
      copy:
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        content: "{{ lookup('template', 'templates/cw-agent-config.json.j2') }}"

    - name: "OBS | Start CloudWatch agent"
      service:
        name: amazon-cloudwatch-agent
        state: started
        enabled: true

    # ── Secrets Rotation ──────────────────────────────────
    - name: "SEC | Validate Secrets Manager access"
      command: >
        aws secretsmanager get-secret-value
          --secret-id "{{ app_name }}/{{ item }}/db-password"
          --region {{ aws_region }}
          --query SecretString --output text
      register: secret_check
      changed_when: false
      no_log: true
      loop: "{{ services | map(attribute='name') | list }}"

    - name: "SEC | Report secrets access status"
      debug:
        msg: "✓ Secrets accessible for: {{ services | map(attribute='name') | join(', ') }}"

# ── Service Health Validation ────────────────────────────
- name: "OcadoFlow :: Validate Service Health"
  hosts: localhost
  gather_facts: false
  vars:
    gateway_url: "https://{{ lookup('env','GATEWAY_URL') | default('staging.api.ocadoflow.io') }}"
    services:
      - name: products
        path: /api/v1/products
        expected_status: 401   # Healthy but auth-protected
      - name: orders
        path: /api/v1/orders
        expected_status: 401
      - name: iam
        path: /api/v1/iam/users
        expected_status: 401

  tasks:
    - name: "HEALTH | Check service endpoints"
      uri:
        url: "{{ gateway_url }}{{ item.path }}"
        method: GET
        status_code: "{{ item.expected_status }}"
        validate_certs: true
        timeout: 10
      register: health_results
      loop: "{{ services }}"
      retries: 3
      delay: 10

    - name: "HEALTH | Report results"
      debug:
        msg: "✓ {{ item.item.name }}: {{ item.status }} in {{ item.elapsed }}s"
      loop: "{{ health_results.results }}"

    - name: "HEALTH | Fail if any service unhealthy"
      fail:
        msg: "Service {{ item.item.name }} unhealthy (got {{ item.status }})"
      when: item.status not in [200, 401, 403]
      loop: "{{ health_results.results }}"

# ── RBAC Policy Push ─────────────────────────────────────
- name: "OcadoFlow :: Enforce IAM RBAC Policies"
  hosts: localhost
  gather_facts: false
  vars:
    aws_region: eu-west-1
    rbac_roles:
      - name: admin
        policies:
          - products:read
          - products:write
          - orders:read
          - orders:write
          - iam:read
          - iam:manage
      - name: ops
        policies:
          - products:read
          - orders:read
          - orders:write
      - name: viewer
        policies:
          - products:read
          - orders:read

  tasks:
    - name: "IAM | Sync RBAC roles to IAM service"
      uri:
        url: "https://{{ lookup('env','GATEWAY_URL') }}/api/v1/iam/roles/{{ item.name }}"
        method: PUT
        body_format: json
        body:
          name: "{{ item.name }}"
          permissions: "{{ item.policies }}"
          updated_by: "ansible-automation"
          updated_at: "{{ ansible_date_time.iso8601 }}"
        headers:
          Authorization: "Bearer {{ lookup('env','ADMIN_TOKEN') }}"
        status_code: [200, 201]
      loop: "{{ rbac_roles }}"
      register: rbac_sync

    - name: "IAM | Confirm RBAC sync"
      debug:
        msg: "✓ Synced role '{{ item.item.name }}' with {{ item.item.policies | length }} permissions"
      loop: "{{ rbac_sync.results }}"
